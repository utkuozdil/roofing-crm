packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# esbuild ships a platform binary via a postinstall script; NodejsFunction bundling
# needs it. Every other dependency stays script-free.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/amazon-bedrock@5.0.69'
  - '@ai-sdk/openai@4.0.53'
